# Gitleaks config — extends default rules with project-specific allowlists.
# Docs: https://github.com/gitleaks/gitleaks/blob/master/README.md#configuration

[extend]
useDefault = true

[allowlist]
description = "specialists repository allowlist"
# Keep acknowledgments narrow. Do not blanket-allowlist generated findings
# without a bead that explains why the debt is accepted. Historical findings
# are acknowledged in .gitleaks/baseline.json (unitAI-xsrpn) and still fail
# if a new fingerprint appears outside the baseline.
stopwords = []
regexes = [
    '''uid:gid''',  # Docker --user placeholder in historical xtrm reports; not a credential.
]
paths = [
    # Local secrets (gitignored — never committed). The --no-git scan walks
    # the filesystem, so local-only env files need explicit exclusions.
    '''^\.env$''',
    '''^\.env\.local$''',
    '''^\.env\.development\.local$''',
    '''^\.env\.test\.local$''',
    '''^\.env\.production\.local$''',
    '''^\.env\.example$''',

    # Beads issue tracker exports contain memory keys and Dolt hashes that can
    # trip entropy-based rules; issue hygiene is handled by the beads workflow.
    '''^\.beads/.*''',

    # Specialist runtime state and local DB caches.
    '''^\.specialists/db/.*''',
    '''^\.specialists/jobs/.*''',
    '''^\.specialists/ready/.*''',

    # Dolt internal storage and xtrm local claim/cache files.
    '''^\.dolt/.*''',
    '''^\.xtrm/statusline-claim$''',
    '''^\.xtrm/logs/.*''',
    '''^\.xtrm/cache/.*''',

    # One-off board-audit handoff dumps. The exports contain ANSI-wrapped
    # `REDACTED` markers from beads memory-store dumps, not credentials, but
    # the entropy heuristic still trips on them. The path is not gitignored
    # (see .gitignore addition) but the dead branch board-audit/unitAI-tpafe
    # keeps the historical d74adfe1 commit reachable, so full-history scans
    # keep re-hitting it.
    '''^\.xtrm/board-audit/.*''',

    # Redaction test fixtures contain deliberately-fake secrets (PEM blocks,
    # token prefixes) to verify the diff-evidence redactor strips them.
    # See tests/unit/specialist/git-diff-evidence.test.ts and bead unitAI-ub65d.2.
    '''^tests/unit/specialist/git-diff-evidence\.test\.ts$''',
]
