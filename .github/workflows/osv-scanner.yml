name: OSV Scanner

# Vulnerability scanner from Google's OSV.dev — replaces Dependency Review on
# user-private repos where Dependency Review (a GHAS feature) is unavailable.
# Scans manifests + lockfiles against the OSV.dev database.

on:
  push:
    branches: [main, master]    # scan immediately after every merge
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "0 6 * * 1"  # Monday 06:00 UTC weekly

permissions:
  contents: read

jobs:
  pr-scan:
    if: github.event_name == 'pull_request'
    name: OSV scan
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["self-hosted","linux","mercury-lite","specialists"]') }}
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Install osv-scanner
        run: |
          OSV_VERSION=v2.3.8
          curl -sSL -o /tmp/osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/${OSV_VERSION}/osv-scanner_linux_amd64"
          chmod +x /tmp/osv-scanner
          sudo install /tmp/osv-scanner /usr/local/bin/osv-scanner
          osv-scanner --version

      - name: Scan PR payload to JSON
        id: scan
        shell: bash
        run: |
          set -euo pipefail
          set +e
          osv-scanner scan source --recursive --no-resolve --format json . > /tmp/osv-scan.json
          status=$?
          set -e
          if [[ ! -s /tmp/osv-scan.json ]]; then
            echo "osv-scanner did not emit JSON output" >&2
            exit 1
          fi
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"

      - name: Classify PR findings
        id: classify
        shell: bash
        run: |
          set -euo pipefail
          node scripts/osv-security-forced-classifier.cjs \
            --input /tmp/osv-scan.json \
            --details-json /tmp/osv-classification.json \
            | tee /tmp/osv-summary.jsonl
          {
            echo "verdict=$(jq -r '.verdict' /tmp/osv-classification.json)"
            echo "total_findings=$(jq -r '.totalFindings' /tmp/osv-classification.json)"
            echo "security_forced_count=$(jq -r '.securityForcedCount' /tmp/osv-classification.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Upsert PR comment
        if: always() && steps.classify.conclusion == 'success'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const details = JSON.parse(readFileSync('/tmp/osv-classification.json', 'utf8'));
          const marker = '<!-- osv-scanner-pr-summary -->';
          const findingLines = details.findings.length === 0
            ? ['- none']
            : details.findings.slice(0, 10).map((finding) => {
                const id = finding.id ?? finding.aliases?.[0] ?? 'unknown-id';
                const pkg = finding.packageName ?? 'unknown-package';
                const score = finding.maxCvssScore == null ? 'n/a' : String(finding.maxCvssScore);
                const reasons = finding.reasons.length > 0 ? `; reasons=${finding.reasons.join(',')}` : '';
                return `- ${id} (${pkg}, cvss=${score}${reasons})`;
              });
          const findingOverflow = details.findings.length > 10
            ? `\n- ... ${details.findings.length - 10} more finding(s)`
            : '';
          const body = [
            marker,
            '## OSV scan summary',
            '',
            `- verdict: \`${details.verdict}\``,
            `- total findings: **${details.totalFindings}**`,
            `- SECURITY_FORCED findings: **${details.securityForcedCount}**`,
            '- PR policy: advisory unless a SECURITY_FORCED finding is present.',
            '- Push to main/master and the weekly schedule remain hard gates on any finding.',
            '',
            `Approximation note: ${details.approximation}`,
            '',
            'Top findings:',
            ...findingLines,
            findingOverflow,
          ].join('\n');

          const headers = {
            Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
            Accept: 'application/vnd.github+json',
            'Content-Type': 'application/json',
            'X-GitHub-Api-Version': '2022-11-28',
          };
          const base = `${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}/issues/${process.env.PR_NUMBER}/comments`;

          const listResponse = await fetch(base, { headers });
          if (!listResponse.ok) {
            const text = await listResponse.text();
            throw new Error(`failed to list PR comments: ${listResponse.status} ${text}`);
          }
          const comments = await listResponse.json();
          const existing = comments.find((comment) => typeof comment.body === 'string' && comment.body.includes(marker));
          const request = existing
            ? {
                url: `${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}/issues/comments/${existing.id}`,
                method: 'PATCH',
              }
            : { url: base, method: 'POST' };
          const response = await fetch(request.url, {
            method: request.method,
            headers,
            body: JSON.stringify({ body }),
          });
          if (!response.ok) {
            const text = await response.text();
            throw new Error(`failed to upsert PR comment: ${response.status} ${text}`);
          }
          NODE

      - name: Fail on SECURITY_FORCED findings
        if: steps.classify.outputs.security_forced_count != '0'
        run: |
          echo "SECURITY_FORCED findings detected; blocking PR per dependency-bump policy." >&2
          exit 1

  protected-scan:
    if: github.event_name != 'pull_request'
    name: OSV scan (push/schedule hard gate)
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["self-hosted","linux","mercury-lite","specialists"]') }}
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Install osv-scanner
        run: |
          OSV_VERSION=v2.3.8
          curl -sSL -o /tmp/osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/${OSV_VERSION}/osv-scanner_linux_amd64"
          chmod +x /tmp/osv-scanner
          sudo install /tmp/osv-scanner /usr/local/bin/osv-scanner
          osv-scanner --version

      - name: Scan protected branches / schedule
        shell: bash
        run: |
          set -euo pipefail
          set +e
          osv-scanner scan source --recursive --no-resolve --format json . > /tmp/osv-scan.json
          status=$?
          set -e
          if [[ ! -s /tmp/osv-scan.json ]]; then
            echo "osv-scanner did not emit JSON output" >&2
            exit 1
          fi
          node scripts/osv-security-forced-classifier.cjs --input /tmp/osv-scan.json
          exit "$status"
