name: tests

permissions:
  contents: write

# The suite is the merge gate.
#
# Deliberately unfiltered: every other workflow here is path-scoped, and the only
# vitest call in CI (telemetry-contract.yml) names six files. A pull request that
# touched none of them ran no tests at all. See bead xtrm-wiy5n.4.26.

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Rebuild final skills-v4 distribution
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/skills-v4-runtime-doctrine'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_HEAD_REF" --depth=2
          git checkout -B "$GITHUB_HEAD_REF" "origin/$GITHUB_HEAD_REF"
          NODE_ENV=test bun run build

          # Restore the normal workflow in the durable tree.
          git show HEAD^:.github/workflows/tests.yml > .github/workflows/tests.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist .github/workflows/tests.yml
          if ! git diff --cached --quiet; then
            git commit -m "build(skills): refresh v4 distributable payload"
            git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
            git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          fi
      - name: Typecheck
        run: bun run lint
      - name: Run test suite
        run: bun run test
      - name: Report quarantine count
        if: always()
        run: |
          COUNT=$(grep -cE "^\s+'tests/.*', // ISSUE:" vitest.config.ts || true)
          echo "Quarantined suites excluded from this job: **$COUNT** (bead xtrm-wiy5n.4.11)" >> "$GITHUB_STEP_SUMMARY"
