name: release-gate

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      cross_repo_assets: ${{ steps.filter.outputs.cross_repo_assets }}
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            cross_repo_assets:
              - config/skills/**
              - config/specialists/**
              - config/mandatory-rules/**
              - config/catalog/**
              - config/hooks/**
              - config/nodes/**
              - package.json
              - dist/index.js
              - dist/asset-contract.json

  asset-contract:
    needs: changes
    if: needs.changes.outputs.cross_repo_assets == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify committed asset contract is fresh
        run: |
          set -euo pipefail
          tmp_contract=$(mktemp)
          cp dist/asset-contract.json "$tmp_contract"
          bun run generate:contract
          cmp -s dist/asset-contract.json "$tmp_contract" || {
            echo 'Run: bun run generate:contract && git add dist/asset-contract.json'
            exit 1
          }
      - name: Read package version
        id: package
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # XTRM_TOOLS_DISPATCH_PAT must be configured in repo secrets for repository_dispatch.
      # Fine-grained PATs need Contents: write access on xtrm-dev/core.
      - name: Dispatch core asset validation
        env:
          GH_TOKEN: ${{ secrets.XTRM_TOOLS_DISPATCH_PAT }}
          SPECIALISTS_SHA: ${{ github.sha }}
          SPECIALISTS_TAG: v${{ steps.package.outputs.version }}
          SPECIALISTS_PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN}" || {
            echo 'XTRM_TOOLS_DISPATCH_PAT is required for core asset validation dispatch'
            exit 1
          }
          node <<'NODE' > dispatch-payload.json
          const fs = require('node:fs');
          const payload = {
            event_type: 'specialists-asset-validation',
            client_payload: {
              specialists_sha: process.env.SPECIALISTS_SHA,
              specialists_tag: process.env.SPECIALISTS_TAG,
              specialists_package_version: process.env.SPECIALISTS_PACKAGE_VERSION,
            },
          };
          fs.writeFileSync('dispatch-payload.json', JSON.stringify(payload, null, 2) + '\n');
          NODE
          gh api repos/xtrm-dev/core/dispatches --method POST --input dispatch-payload.json --silent
