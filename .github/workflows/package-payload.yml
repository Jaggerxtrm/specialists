name: package-payload

on:
  pull_request:
    paths:
      - package.json
      - src/**
      - config/**
      - dist/**
      - scripts/assert-package-payload.sh
      - .github/workflows/package-payload.yml

jobs:
  changes:
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["self-hosted","linux","mercury-lite","specialists"]') }}
    outputs:
      package_payload: ${{ steps.filter.outputs.package_payload }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            package_payload:
              - package.json
              - src/**
              - config/**
              - dist/**
              - scripts/assert-package-payload.sh
              - .github/workflows/package-payload.yml

  payload-contract:
    needs: changes
    if: needs.changes.outputs.package_payload == 'true'
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["self-hosted","linux","mercury-lite","specialists"]') }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: |
          echo 'package-payload: installing dependencies with frozen lockfile'
          bun install --frozen-lockfile
          echo 'package-payload: install succeeded'
      - name: Build package payload
        run: |
          echo 'package-payload: building distributable payload before contract assertion'
          bun run build
          echo 'package-payload: build succeeded'
      - name: Generate npm pack manifest
        run: |
          echo 'package-payload: generating npm pack dry-run manifest'
          npm pack --dry-run --json > /tmp/package-payload.json
          echo 'package-payload: pack manifest generated'
      - name: Assert payload contract
        run: |
          echo 'package-payload: asserting required payload assets'
          if ! scripts/assert-package-payload.sh /tmp/package-payload.json \
            dist/index.js \
            dist/lib.js \
            dist/types/lib.d.ts \
            bin/install.js \
            package.json \
            config/specialists/executor.specialist.json \
            config/specialists/reviewer.specialist.json \
            config/mandatory-rules/executor-delivery.md \
            config/mandatory-rules/index.json \
            config/skills/using-specialists-v3/SKILL.md \
            config/catalog/index.json \
            config/catalog/native.json \
            config/catalog/gitnexus.json \
            config/catalog/serena.json \
            dist/asset-contract.json \
            LICENSE; then
            echo 'package-payload: CONTRACT FAILURE — asserted asset missing from successfully-built payload' >&2
            exit 1
          fi
          echo 'package-payload: contract assertion passed'

  packed-smoke:
    needs: changes
    if: needs.changes.outputs.package_payload == 'true'
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["self-hosted","linux","mercury-lite","specialists"]') }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build, pack, and smoke installed tarball
        run: |
          set -euo pipefail
          bun run build
          tarball=$(npm pack --json | jq -r '.[0].filename')
          cp "$tarball" /tmp/sp-test.tgz
          prefix=/tmp/sp-smoke-prefix
          workdir=$(mktemp -d)
          npm install -g --prefix="$prefix" /tmp/sp-test.tgz
          export PATH="$prefix/bin:$PATH"
          cd "$workdir"
          sp --version
          sp doctor --check-drift
          sp prune-stale-defaults --dry-run
          sp clean --dry-run
          sp list --compact
